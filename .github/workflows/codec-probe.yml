name: codec-probe
on:
  push:
    branches: [ci/codec-witness-probe]
jobs:
  # A: the whole codec mutation run on the hosted runner, every per-mutant test under a 4 GiB address-space cap
  capped:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
      - name: memory log (background)
        run: (while true; do echo "$(date +%T) $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"}')"; sleep 5; done) > /tmp/mem.log 2>&1 &
      - name: witness — codec, capped
        run: |
          node /tmp/witness/witness.mjs mutate light/codec.mjs --timeout 60000 --cap 500 --test bash -c 'ulimit -v 4194304; exec timeout -k 5 40 node light/codec.test.mjs' > /tmp/codec.json && code=0 || code=$?
          echo "exit $code"; head -c 3000 /tmp/codec.json; exit $code
      - if: always()
        run: tail -n 400 /tmp/mem.log | awk 'NR%3==1'
  # B: diagnosis — mutant 29 alone (journal growth guard === flipped to !==), uncapped, memory logged every second
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: apply mutant 29 to the codec (the journal growth guard)
        run: |
          sed -i 's/if (log.jn === log.J.length)/if (log.jn !== log.J.length)/' light/codec.mjs
          grep -n "log.jn !== log.J.length" light/codec.mjs
      - name: run the codec tests on that mutant, uncapped, memory every second
        run: |
          (while true; do echo "$(date +%T) $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"}')"; sleep 1; done) &
          timeout -k 5 60 node light/codec.test.mjs > /tmp/t.txt 2>&1; echo "test exit $?"; tail -20 /tmp/t.txt
