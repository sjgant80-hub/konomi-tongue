name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: the tongue kernel's tests (made-up text only)
        run: node --test tongue.test.mjs
      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: get the witness gate
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
      # Each root kernel's mutation run happens HERE, on GitHub's runner, and tools/witness-check.mjs fails the build unless
      # it is clean, not capped, and re-derives exactly the counts committed in data/witness.json (no survivor is baselined).
      - name: witness — every mutant of the tongue kernel must die
        run: |
          node /tmp/witness/witness.mjs mutate tongue.mjs --timeout 60000 --cap 400 --test node --test tongue.test.mjs > /tmp/w-tongue.json || true
          node tools/witness-check.mjs tongue /tmp/w-tongue.json
      - name: the shipped JSON mode — its tests, then every mutant of tongue-pack.mjs must die
        run: |
          node --test tongue-pack.test.mjs
          node /tmp/witness/witness.mjs mutate tongue-pack.mjs --timeout 60000 --cap 400 --test node --test tongue-pack.test.mjs > /tmp/w-pack.json || true
          node tools/witness-check.mjs pack /tmp/w-pack.json
      - name: the cost-case kernel — its tests, then every mutant of tongue-cost.mjs must die
        run: |
          node --test tongue-cost.test.mjs
          node /tmp/witness/witness.mjs mutate tongue-cost.mjs --timeout 60000 --cap 400 --test node tongue-cost.test.mjs > /tmp/w-cost.json || true
          node tools/witness-check.mjs cost /tmp/w-cost.json
      - name: the ship seal, and its record re-derived
        run: |
          node tools/ship.mjs --check
          if [ -f data/ship-run.json ]; then node tools/ship.mjs --verify; fi
      - name: the seal is exactly what the committed inputs give
        run: node tools/seal.mjs --check
      - name: every read re-graded, the JSON channel rebuilt, every number re-derived from the record
        run: if [ -f data/run.json ]; then node tools/run.mjs --verify; else echo "sealed, not yet run"; fi
      - name: page fixpoint — the live page IS the gated kernel and the real record
        run: |
          node tools/make-page.mjs
          git diff --exit-code index.html README.md llms.txt
          if [ -f data/run.json ]; then git diff --exit-code data/verdict.json; fi
      - name: no untraced price anywhere
        run: |
          git clone --quiet https://github.com/sjgant80-hub/fallstack /tmp/fallstack && git -C /tmp/fallstack checkout --quiet 4eeb828
          node /tmp/fallstack/tools/price-check.mjs .
